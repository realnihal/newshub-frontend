<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsHub - Your Daily News Feed</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">N</span>
                <span class="logo-text">NewsHub</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">Feed</a>
                <a href="about.html" class="nav-link">About</a>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <header class="page-header">
            <h1>Latest News</h1>
            <p class="subtitle">Stay informed with the latest headlines from around the world</p>
        </header>

        <div class="controls">
            <div class="view-toggle">
                <button class="view-btn active" data-view="topics">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                    </svg>
                    Top Stories
                </button>
                <button class="view-btn" data-view="articles">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                    All Articles
                </button>
            </div>
            <div class="search-box">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Search news...">
            </div>
            <button class="refresh-btn" id="refreshBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                Refresh
            </button>
        </div>

        <div class="stats-bar" id="statsBar">
            <div class="stat">
                <span class="stat-value" id="totalArticles">-</span>
                <span class="stat-label">Articles</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="totalFeeds">-</span>
                <span class="stat-label">Feeds</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="totalTopics">-</span>
                <span class="stat-label">Stories</span>
            </div>
        </div>

        <!-- Topics View (Default) -->
        <div class="topics-container" id="topicsContainer">
            <div class="topics-grid" id="topicsGrid">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Analyzing news stories...</p>
                </div>
            </div>
        </div>

        <!-- Articles View -->
        <div class="articles-container" id="articlesContainer" style="display: none;">
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="news">News</button>
                <button class="filter-btn" data-category="tech">Tech</button>
                <button class="filter-btn" data-category="sports">Sports</button>
            </div>
            <div class="news-grid" id="newsGrid">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Loading articles...</p>
                </div>
            </div>
            <div class="load-more-container">
                <button class="load-more-btn" id="loadMoreBtn" style="display: none;">
                    Load More Articles
                </button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 NewsHub. Powered by NewsAPI.</p>
            <div class="footer-links">
                <a href="about.html">About</a>
                <a href="https://github.com" target="_blank">GitHub</a>
            </div>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
